services:
  accounts:
    build: .
    restart: unless-stopped
    mem_limit: 384m
    cpus: "1.0"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    ports:
      - "127.0.0.1:${TOMDESK_ACCOUNT_PUBLISH_PORT:-8091}:8091"
    environment:
      TOMDESK_ACCOUNT_DB: /data/accounts.sqlite3
      TOMDESK_SESSION_TTL_SECONDS: "${TOMDESK_SESSION_TTL_SECONDS:-43200}"
      TOMDESK_REMEMBER_TTL_SECONDS: "${TOMDESK_REMEMBER_TTL_SECONDS:-604800}"
      TOMDESK_TICKET_TTL_SECONDS: "${TOMDESK_TICKET_TTL_SECONDS:-300}"
      TOMDESK_LOGIN_WINDOW_SECONDS: "${TOMDESK_LOGIN_WINDOW_SECONDS:-60}"
      TOMDESK_LOGIN_IP_LIMIT: "${TOMDESK_LOGIN_IP_LIMIT:-30}"
      TOMDESK_LOGIN_ACCOUNT_LIMIT: "${TOMDESK_LOGIN_ACCOUNT_LIMIT:-10}"
      TOMDESK_HASH_CONCURRENCY: "${TOMDESK_HASH_CONCURRENCY:-2}"
      TOMDESK_PUBLIC_DOCS: "0"
      TOMDESK_ADMIN_ORIGIN: "${TOMDESK_ADMIN_ORIGIN:-}"
      TOMDESK_ADMIN_PATH: "${TOMDESK_ADMIN_PATH:-/admin}"
      TOMDESK_ADMIN_SESSION_TTL_SECONDS: "${TOMDESK_ADMIN_SESSION_TTL_SECONDS:-3600}"
      TOMDESK_TRUSTED_PROXY_IPS: "${TOMDESK_TRUSTED_PROXY_IPS:-}"
    volumes:
      - accounts-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  accounts-data:
